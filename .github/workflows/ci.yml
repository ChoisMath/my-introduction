name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t me-chois .
      # 운영과 같은 기본 CMD(시작 시 migrate deploy → 서버)로 띄워 헬스체크와 테이블 생성을 확인한다.
      - run: |
          docker run -d --name app --network host -e PORT=3200 -e RAILWAY_VOLUME_MOUNT_PATH=/tmp \
            -e DATABASE_URL=postgresql://e2e:e2e@localhost:5432/e2e -e AUTH_SECRET=ci-secret-ci-secret-ci-secret-000 me-chois
          for i in $(seq 1 30); do curl -fs http://localhost:3200/api/health && break; sleep 2; done
          docker logs app
          curl -fs http://localhost:3200/api/health
          PGPASSWORD=e2e psql -h localhost -U e2e -d e2e -c 'SELECT count(*) FROM "MotionViewer"'
