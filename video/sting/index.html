    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const CUES = JSON.parse(document.getElementById("cues").textContent);
      const FRAME = 1 / 30;

      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // 콘크리트 벽: 시드 고정 얼룩. 시간과 무관한 정적 배경이라 초기화 때 한 번만 그린다.
      function paintWall() {
        const ctx = document.getElementById("wall").getContext("2d");
        const rnd = mulberry32(20260409);
        ctx.fillStyle = "#b9b6af";
        ctx.fillRect(0, 0, 1920, 1080);
        for (let i = 0; i < 26000; i++) {
          const x = rnd() * 1920;
          const y = rnd() * 1080;
          const s = 1 + rnd() * 3;
          const dark = rnd() < 0.55;
          ctx.fillStyle = dark ? `rgba(40,38,34,${0.05 + rnd() * 0.12})` : `rgba(255,255,255,${0.06 + rnd() * 0.12})`;
          ctx.fillRect(x, y, s, s);
        }
        for (let i = 0; i < 18; i++) {
          const x = rnd() * 1920;
          const y = rnd() * 1080;
          ctx.fillStyle = `rgba(30,28,25,${0.05 + rnd() * 0.05})`;
          ctx.fillRect(x, y, 80 + rnd() * 320, 40 + rnd() * 180);
        }
        const g = document.getElementById("grid").getContext("2d");
        g.strokeStyle = "rgba(0,0,0,0.16)";
        g.lineWidth = 2;
        for (let x = 0; x <= 1920; x += 60) {
          g.beginPath();
          g.moveTo(x, 0);
          g.lineTo(x, 1080);
          g.stroke();
        }
        for (let y = 0; y <= 1080; y += 60) {
          g.beginPath();
          g.moveTo(0, y);
          g.lineTo(1920, y);
          g.stroke();
        }
        g.strokeStyle = "rgba(0,0,0,0.38)";
        g.lineWidth = 3;
        for (let x = 0; x <= 1920; x += 300) {
          g.beginPath();
          g.moveTo(x, 0);
          g.lineTo(x, 1080);
          g.stroke();
        }
        for (let y = 0; y <= 1080; y += 300) {
          g.beginPath();
          g.moveTo(0, y);
          g.lineTo(1920, y);
          g.stroke();
        }
      }

      const HAND =
        '<svg viewBox="0 0 120 140"><path transform="translate(10 10)" d="M38 128 L38 86 L22 70 C14 62 22 50 32 58 L38 64 L38 14 C38 2 60 2 60 14 L60 60 L66 60 L66 48 C66 38 84 38 84 48 L84 60 L90 60 L90 54 C90 44 106 44 106 54 L106 100 C106 116 94 128 78 128 Z" fill="#000"/><path d="M38 128 L38 86 L22 70 C14 62 22 50 32 58 L38 64 L38 14 C38 2 60 2 60 14 L60 60 L66 60 L66 48 C66 38 84 38 84 48 L84 60 L90 60 L90 54 C90 44 106 44 106 54 L106 100 C106 116 94 128 78 128 Z" fill="#fff" stroke="#000" stroke-width="8" stroke-linejoin="round"/></svg>';

      function spanChars(el, text) {
        el.textContent = "";
        return Array.from(text).map((c) => {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c === " " ? " " : c;
          el.appendChild(s);
          return s;
        });
      }

      function build() {
        const vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
        const url = vars.url || "me.chois.pro";
        const formula = vars.formula || "f(x) = 수업 + 연수 + 개발";
        const tape = vars.tape || "작업 중 · WORK IN PROGRESS";

        paintWall();
        document.querySelectorAll(".cursor").forEach((c) => (c.innerHTML = HAND));
        document.getElementById("tapetext").textContent = (tape + "  ·  ").repeat(5);
        const urlChars = spanChars(document.getElementById("urltext"), url);
        const fChars = spanChars(document.getElementById("ftext"), formula);

        const tl = gsap.timeline({ paused: true, defaults: { overwrite: false } });

        const shake = (t, amt) => {
          tl.set("#shake", { x: amt, y: -amt * 0.6 }, t);
          tl.set("#shake", { x: -amt * 0.5, y: amt * 0.4 }, t + FRAME);
          tl.set("#shake", { x: 0, y: 0 }, t + 2 * FRAME);
        };
        // 슬램: 가속해서 들어와 제자리에 딱 멈춘 뒤 1~2프레임 찌그러짐.
        const slam = (sel, land, from, dur = 0.12, amt = 10) => {
          tl.fromTo(sel, { x: from.x || 0, y: from.y || 0 }, { x: 0, y: 0, duration: dur, ease: "power3.in", immediateRender: true }, land - dur);
          tl.fromTo(sel, { scaleX: 1.03, scaleY: 0.94 }, { scaleX: 1, scaleY: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, land);
          if (amt) shake(land, amt);
        };
        // 스티커: 크게 떠 있다가 한 번에 붙으며 살짝 회전.
        const slap = (sel, t, rot) => {
          tl.fromTo(sel, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: "steps(1)", immediateRender: true }, t - 0.04);
          tl.fromTo(sel, { scale: 2.4, rotation: rot - 22 }, { scale: 1, rotation: rot, duration: 0.07, ease: "power4.in", immediateRender: true }, t - 0.07);
          tl.fromTo(sel, { scale: 1.08 }, { scale: 1, duration: 0.06, ease: "power2.out", immediateRender: false }, t);
        };
        const blink = (sel, from, to, period = 0.25) => {
          const n = Math.max(1, Math.round((to - from) / period));
          for (let i = 0; i < n; i++) tl.set(sel, { opacity: i % 2 === 0 ? 1 : 0 }, from + i * period);
        };
        const typeChars = (chars, from, to) => {
          const step = chars.length > 1 ? (to - from) / (chars.length - 1) : 0;
          chars.forEach((s, i) => tl.set(s, { opacity: 1 }, from + i * step));
          return chars.map((_, i) => from + i * step);
        };

        /* ---------- S1 ---------- */
        tl.set("#grid", { opacity: 1 }, CUES.gridOn);
        slam("#browser", CUES.slamBrowser, { y: -1200 }, CUES.slamBrowser, 14);
        typeChars(urlChars, CUES.urlType[0], CUES.urlType[1]);
        blink("#urlcaret", 0, 2.619, 0.25);
        tl.fromTo("#cursor1", { x: 1700, y: 1000 }, { x: 1180, y: 640, duration: CUES.cursorIn[1] - CUES.cursorIn[0], ease: "power2.out" }, CUES.cursorIn[0]);
        slap("#live", CUES.live, -8);
        slam("#card1", CUES.cards[0], { x: -1200 }, 0.1, 10);
        slam("#card2", CUES.cards[1], { y: -900 }, 0.1, 10);
        slam("#card3", CUES.cards[2], { x: 1900 }, 0.1, 10);
        slam("#card4", CUES.cards[3], { y: 900 }, 0.1, 10);
        slap("#star1", CUES.star, -12);
        slap("#squiggle", CUES.squiggle, 6);
        tl.fromTo(
          "#tape",
          { scaleX: 0, rotation: -6, transformOrigin: "left center" },
          { scaleX: 1, rotation: -6, duration: CUES.tape[1] - CUES.tape[0], ease: "power2.in" },
          CUES.tape[0]
        );
        tl.fromTo("#tape", { y: -10 }, { y: 0, duration: 0.1, ease: "power4.out", immediateRender: false }, CUES.tape[1]);
        shake(CUES.tape[1], 6);
        // 커서가 테이프를 당기는 손처럼 따라감
        tl.to("#cursor1", { x: 1740, y: 430, duration: CUES.tape[1] - CUES.tape[0], ease: "power2.in" }, CUES.tape[0]);

        /* ---------- S2 ---------- */
        const dragDur = CUES.winLand - CUES.cut2;
        tl.fromTo("#win", { x: -1000, y: 560 }, { x: 0, y: 0, duration: dragDur, ease: "power2.inOut" }, CUES.cut2);
        tl.fromTo("#win", { scaleY: 0.96 }, { scaleY: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, CUES.winLand);
        shake(CUES.winLand, 8);
        tl.fromTo("#cursor2", { x: -200, y: 790 }, { x: 800, y: 230, duration: dragDur, ease: "power2.inOut" }, CUES.cut2);
        blink("#fcaret", CUES.cut2, CUES.cut3, 0.25);
        typeChars(fChars, CUES.formulaType[0], CUES.formulaType[1]);
        tl.to("#cursor2", { x: 1110, y: 690, duration: CUES.runPress - CUES.formulaType[1] - 0.05, ease: "power2.inOut" }, CUES.formulaType[1] + 0.05);
        tl.set("#runbtn .face", { x: 12, y: 12 }, CUES.runPress);
        tl.set("#cursor2", { y: 702 }, CUES.runPress);
        tl.set("#runbtn .face", { x: 0, y: 0 }, CUES.runRelease);
        tl.set("#cursor2", { y: 690 }, CUES.runRelease);
        slam("#chart", CUES.chartSlam, { x: 1200 }, 0.1, 8);
        slam("#arrow", CUES.chartSlam + 0.04, { y: -600 }, 0.08, 0);
        gsap.set("#arrow", { rotation: 18 });
        ["#bar1", "#bar2", "#bar3"].forEach((b, i) => {
          tl.fromTo(b, { scaleY: 0, transformOrigin: "bottom center" }, { scaleY: 1, duration: 0.07, ease: "power3.in" }, CUES.bars[i] - 0.07);
          shake(CUES.bars[i], 3);
        });

        /* ---------- S3 ---------- */
        slam("#loader", CUES.loaderLand, { y: -1100 }, CUES.loaderLand - CUES.cut3, 14);
        const prog = { v: 0 };
        const pctEl = document.getElementById("pct");
        tl.fromTo("#fill", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 0.99, duration: CUES.progress[1] - CUES.progress[0], ease: `steps(${CUES.progressSteps})` }, CUES.progress[0]);
        tl.to(
          prog,
          {
            v: 99,
            duration: CUES.progress[1] - CUES.progress[0],
            ease: `steps(${CUES.progressSteps})`,
            onUpdate: () => (pctEl.textContent = Math.round(prog.v) + "%"),
          },
          CUES.progress[0]
        );
        tl.fromTo("#loader", { x: 0 }, { x: -8, duration: FRAME, ease: "none", immediateRender: false }, CUES.buzzer);
        tl.to("#loader", { x: 8, duration: FRAME, ease: "none" }, CUES.buzzer + FRAME);
        tl.to("#loader", { x: -5, duration: FRAME, ease: "none" }, CUES.buzzer + 2 * FRAME);
        tl.to("#loader", { x: 0, duration: FRAME, ease: "none" }, CUES.buzzer + 3 * FRAME);
        slap("#err", CUES.buzzer + 0.05, 6);
        tl.fromTo("#cursor3", { x: 1500, y: -240 }, { x: 1180, y: 560, duration: CUES.cursorDown[1] - CUES.cursorDown[0], ease: "power3.in" }, CUES.cursorDown[0]);
        tl.set("#cursor3", { y: 574 }, CUES.click);
        tl.set("#cursor3", { y: 560 }, CUES.click + 2 * FRAME);
        tl.set("#fill", { scaleX: 1, backgroundColor: "#5cf2a6" }, CUES.click);
        tl.set(pctEl, { textContent: "100%" }, CUES.click);
        tl.set("#err", { autoAlpha: 0 }, CUES.click);
        shake(CUES.click, 4);

        /* ---------- S4 ---------- */
        tl.set("#flash", { autoAlpha: 0 }, CUES.impact + 2 * FRAME);
        tl.fromTo("#logo", { scale: 1.6, rotation: -6 }, { scale: 1, rotation: 0, duration: 0.1, ease: "power4.in" }, CUES.impact);
        shake(CUES.impact + 0.1, 18);
        slam("#namebox", CUES.name, { x: 1400 }, 0.1, 12);
        slam("#rolebox", CUES.role, { y: 700 }, 0.1, 8);
        ["#bb1", "#bb2", "#bb3", "#bb4", "#bb5"].forEach((b, i) => {
          tl.fromTo(b, { autoAlpha: 0, scale: 1.8 }, { autoAlpha: 1, scale: 1, duration: 0.06, ease: "power4.in" }, CUES.buttons[i] - 0.06);
          tl.fromTo(b, { x: 12, y: 12 }, { x: 0, y: 0, duration: 0.06, ease: "steps(1)", immediateRender: false }, CUES.buttons[i]);
        });
        slap("#urlpill", CUES.url, 0);
        slap("#star2", CUES.url + 0.06, 10);
        blink("#urlcaret2", CUES.url, CUES.end + 0.5, 0.5);
        // 홀드: 별 스티커만 ±2° 숨쉬기 (미세한 앰비언트 모션)
        tl.to("#star2", { rotation: 12, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3 }, CUES.hold);

        window.__timelines["main"] = tl;
        tl.seek(0);
      }

      Promise.all([
        document.fonts.load('80px "Black Han Sans"'),
        document.fonts.load('80px "Archivo Black"'),
        document.fonts.ready,
      ]).then(build);
    </script>
  </body>
</html>
